<svg width="980" height="1500" viewBox="0 0 980 1500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1e1e1e"/>
    </marker>
    <style>
      .thin { stroke: #1d1d1d; stroke-width: 2; fill: none; }
      .title { font-family: 'Arial', sans-serif; font-size: 26px; font-weight: 700; fill: #1d1d1d; }
      .label { font-family: 'Arial', sans-serif; font-size: 22px; font-weight: 700; fill: #1d1d1d; }
      .small { font-family: 'Arial', sans-serif; font-size: 18px; fill: #1d1d1d; }
      .box { fill: rgba(255,255,255,0.12); stroke: #1d1d1d; stroke-width: 2.5; rx: 18; }
      .soft-blue { fill: #d9edf7; }
      .soft-yellow { fill: #f3e9c6; }
      .soft-pink { fill: #f3d1cf; }
    </style>
  </defs>

  <rect width="980" height="1500" fill="#f4f1e7"/>

  <g>
    <rect x="58" y="36" width="864" height="120" rx="18" class="soft-blue box"/>
    <text x="490" y="87" text-anchor="middle" class="title">1. USER/CLIENT</text>
    <text x="490" y="120" text-anchor="middle" style="font-family:'Arial'; font-size:24px; font-style:italic; fill:#1d1d1d;">"Research speculative decoding"</text>
    <line x1="490" y1="156" x2="490" y2="192" class="thin" marker-end="url(#arrow)"/>
    <text x="490" y="216" text-anchor="middle" class="label">ResearchRequest</text>
  </g>

  <g>
    <rect x="58" y="245" width="864" height="600" rx="18" class="soft-yellow box"/>
    <text x="490" y="286" text-anchor="middle" class="title">2. AGENT HARNESS</text>

    <rect x="120" y="360" width="220" height="185" rx="14" class="box" fill="rgba(255,255,255,0.15)"/>
    <text x="230" y="405" text-anchor="middle" class="label">OBJECTIVE/CONFIG</text>
    <text x="230" y="450" text-anchor="middle" class="small">query</text>
    <text x="230" y="475" text-anchor="middle" class="small">model</text>
    <text x="230" y="500" text-anchor="middle" class="small">max-steps</text>
    <text x="230" y="525" text-anchor="middle" class="small">timeout</text>

    <rect x="380" y="360" width="220" height="185" rx="14" class="box" fill="rgba(255,255,255,0.15)"/>
    <text x="490" y="405" text-anchor="middle" class="label">AGENT STATE</text>
    <text x="490" y="450" text-anchor="middle" class="small">step_count</text>
    <text x="490" y="475" text-anchor="middle" class="small">visited_urls</text>
    <text x="490" y="500" text-anchor="middle" class="small">notes</text>
    <text x="490" y="525" text-anchor="middle" class="small">tool_history</text>
    <text x="490" y="550" text-anchor="middle" class="small">status</text>

    <rect x="640" y="360" width="220" height="185" rx="14" class="box" fill="rgba(255,255,255,0.15)"/>
    <text x="750" y="405" text-anchor="middle" class="label">MODEL CONTEXT</text>
    <text x="750" y="450" text-anchor="middle" class="small">system prompt</text>
    <text x="750" y="475" text-anchor="middle" class="small">user objective</text>
    <text x="750" y="500" text-anchor="middle" class="small">tool definitions</text>
    <text x="750" y="525" text-anchor="middle" class="small">tool results</text>
    <text x="750" y="550" text-anchor="middle" class="small">selected history</text>

    <rect x="140" y="585" width="700" height="180" rx="18" class="box" fill="rgba(255,255,255,0.15)"/>
    <text x="490" y="630" text-anchor="middle" class="title" style="font-size:26px;">ORCHESTRATOR / AGENT LOOP</text>

    <rect x="180" y="675" width="130" height="55" rx="10" class="box" fill="rgba(255,255,255,0.15)"/>
    <text x="245" y="710" text-anchor="middle" class="small">build context</text>

    <rect x="350" y="675" width="120" height="55" rx="10" class="box" fill="rgba(255,255,255,0.15)"/>
    <text x="410" y="710" text-anchor="middle" class="small">call model</text>

    <rect x="510" y="675" width="160" height="55" rx="10" class="box" fill="rgba(255,255,255,0.15)"/>
    <text x="590" y="710" text-anchor="middle" class="small">inspect response</text>

    <rect x="710" y="675" width="120" height="55" rx="10" class="box" fill="rgba(255,255,255,0.15)"/>
    <text x="770" y="710" text-anchor="middle" class="small">route action</text>

    <line x1="310" y1="702" x2="350" y2="702" class="thin" marker-end="url(#arrow)"/>
    <line x1="470" y1="702" x2="510" y2="702" class="thin" marker-end="url(#arrow)"/>
    <line x1="670" y1="702" x2="710" y2="702" class="thin" marker-end="url(#arrow)"/>

    <path d="M 195 770 C150 800, 170 850, 245 845" class="thin" fill="none" marker-end="url(#arrow)"/>
    <path d="M 350 770 C410 820, 370 850, 415 845" class="thin" fill="none" marker-end="url(#arrow)"/>
    <path d="M 560 770 C620 820, 580 850, 620 845" class="thin" fill="none" marker-end="url(#arrow)"/>
    <path d="M 710 770 C770 830, 700 870, 760 845" class="thin" fill="none" marker-end="url(#arrow)"/>

    <rect x="245" y="815" width="180" height="55" rx="10" class="box" fill="rgba(255,255,255,0.15)"/>
    <text x="335" y="850" text-anchor="middle" class="small">update state/context</text>

    <text x="430" y="823" text-anchor="middle" class="small">tool result</text>

    <path d="M 160 450 C 90 450, 90 720, 160 720" class="thin" fill="none" marker-end="url(#arrow)"/>
    <path d="M 736 590 C 820 620, 820 665, 770 710" class="thin" fill="none" marker-end="url(#arrow)"/>

    <path d="M 305 910 C 305 980, 240 1000, 200 1040" class="thin" fill="none" marker-end="url(#arrow)"/>
    <path d="M 610 910 C 610 980, 700 1000, 770 1040" class="thin" fill="none" marker-end="url(#arrow)"/>

    <text x="240" y="960" text-anchor="middle" class="label">TOOL CALL</text>
    <text x="695" y="960" text-anchor="middle" class="label">FINISH</text>

    <rect x="130" y="1020" width="280" height="145" rx="14" class="box" fill="rgba(255,255,255,0.15)"/>
    <text x="270" y="1068" text-anchor="middle" class="label">TOOL/VALIDATION LAYER</text>
    <text x="270" y="1105" text-anchor="middle" class="small">known tool?</text>
    <text x="270" y="1130" text-anchor="middle" class="small">valid arguments?</text>
    <text x="270" y="1155" text-anchor="middle" class="small">policy allowed?</text>
    <text x="270" y="1180" text-anchor="middle" class="small">repeated call?</text>

    <line x1="270" y1="1165" x2="270" y2="1215" class="thin" marker-end="url(#arrow)"/>
    <text x="270" y="1238" text-anchor="middle" class="label">TOOL EXECUTOR</text>

    <line x1="430" y1="1098" x2="690" y2="1098" class="thin" marker-end="url(#arrow)"/>
    <text x="690" y="1085" text-anchor="middle" class="label">FINAL ANSWER</text>
  </g>

  <g>
    <rect x="58" y="900" width="864" height="350" rx="18" class="soft-pink box"/>
    <text x="490" y="940" text-anchor="middle" class="title">3. TOOLS + ENVIRONMENT</text>

    <rect x="145" y="990" width="150" height="140" rx="14" class="box" fill="rgba(255,255,255,0.12)"/>
    <text x="220" y="1035" text-anchor="middle" class="label">search_web()</text>
    <line x1="220" y1="1055" x2="220" y2="1088" class="thin" marker-end="url(#arrow)"/>
    <text x="220" y="1115" text-anchor="middle" class="small">Search API</text>

    <rect x="338" y="990" width="150" height="140" rx="14" class="box" fill="rgba(255,255,255,0.12)"/>
    <text x="413" y="1035" text-anchor="middle" class="label">read_page()</text>
    <line x1="413" y1="1055" x2="413" y2="1088" class="thin" marker-end="url(#arrow)"/>
    <text x="413" y="1115" text-anchor="middle" class="small">Internet</text>

    <rect x="531" y="990" width="150" height="140" rx="14" class="box" fill="rgba(255,255,255,0.12)"/>
    <text x="606" y="1035" text-anchor="middle" class="label">save_note()</text>
    <line x1="606" y1="1055" x2="606" y2="1088" class="thin" marker-end="url(#arrow)"/>
    <text x="606" y="1115" text-anchor="middle" class="small">Local State</text>

    <rect x="724" y="990" width="150" height="140" rx="14" class="box" fill="rgba(255,255,255,0.12)"/>
    <text x="799" y="1035" text-anchor="middle" class="label">read_notes()</text>
    <line x1="799" y1="1055" x2="799" y2="1088" class="thin" marker-end="url(#arrow)"/>
    <text x="799" y="1115" text-anchor="middle" class="small">Local State</text>
  </g>
</svg>
